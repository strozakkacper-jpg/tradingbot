<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Copy Trading</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0d13;--card:#151925;--card2:#1c2131;--line:#262c3e;--text:#eef1f8;--mut:#8b93a9;--mut2:#5d6479;
  --acc:#8b5cf6;--acc2:#a78bfa;--g:#22c55e;--gbg:rgba(34,197,94,.12);--r:#ef4444;--rbg:rgba(239,68,68,.12);
  --y:#eab308;--ybg:rgba(234,179,8,.12);--rad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:12px 14px calc(84px + env(safe-area-inset-bottom))}
h2{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.mut{color:var(--mut)}.small{font-size:13px}.tiny{font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.b{font-weight:700}.c{text-align:center}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mut)}
.pill.g{background:var(--gbg);color:var(--g)}.pill.r{background:var(--rbg);color:var(--r)}.pill.y{background:var(--ybg);color:var(--y)}.pill.a{background:rgba(139,92,246,.15);color:var(--acc2)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:var(--acc);cursor:pointer}
.btn.g{background:var(--g);color:#04210f}.btn.r{background:var(--r)}.btn.ghost{background:var(--card2);color:var(--text)}
.btn:active,.chip:active,.item:active{transform:scale(.98);opacity:.85}
.btn[disabled]{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.red{color:var(--r)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px;border-radius:10px;font-weight:600;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}.stat .v{font-size:17px;font-weight:700;margin-top:2px}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:76px;resize:vertical}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,18,27,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--mut2);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.tabs button .i{font-size:21px;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--text)}.tabs button.on .i{filter:none;opacity:1}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding:12px 14px 40px;display:none}
.sheet.open{display:block;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{border:0;background:var(--card2);color:var(--text);width:36px;height:36px;border-radius:12px;font-size:18px}
.toast{position:fixed;left:14px;right:14px;top:12px;background:#222842;border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:14px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4);transform:translateY(-140%);transition:transform .25s}
.toast.show{transform:none}
.status{border-radius:var(--rad);padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.status.on{background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(34,197,94,.04));border-color:rgba(34,197,94,.35)}
.status.off{background:var(--card)}
.html{white-space:pre-wrap;word-wrap:break-word}.html a{color:var(--acc2)}.html code{font-size:12px;word-break:break-all}
.empty{color:var(--mut);text-align:center;padding:18px 6px}
.note{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.note:last-child{border:0}
.toggle{position:relative;width:50px;height:30px;flex:none}
.toggle input{display:none}.toggle span{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:99px;transition:.2s}
.toggle span:after{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--g);border-color:var(--g)}.toggle input:checked+span:after{left:22px}
.addr{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;background:var(--card2);border-radius:10px;padding:10px}
.loader{display:flex;justify-content:center;padding:60px}.loader:after{content:"";width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
svg{display:block}
.sl{margin-top:14px}.sl:first-child{margin-top:0}
.slv{font-weight:800;font-size:17px;color:var(--acc2);background:rgba(139,92,246,.12);padding:3px 10px;border-radius:10px;min-width:64px;text-align:center}
.slv.off{color:var(--mut);background:var(--card2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;padding:0;margin:14px 0 4px;border:0;outline:none;
  background:linear-gradient(90deg,var(--acc) var(--p,0%),var(--card2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--acc);box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--acc)}
.slr{display:flex;justify-content:space-between;font-size:11px;color:var(--mut2)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi .stat .v{font-size:19px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}.dot.g{background:var(--g);box-shadow:0 0 8px var(--g)}.dot.r{background:var(--r)}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin-bottom:8px;cursor:pointer}
.ucard:active{transform:scale(.99)}
body.sel{padding-bottom:200px}
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:6;background:rgba(21,25,37,.98);border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.selbar .chip{padding:7px 11px;font-size:13px}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--mut2);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.ck.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rtab{overflow-x:auto;margin:0 -14px;padding:0 14px}
.rtab table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.rtab th{color:var(--mut);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
.rtab th:first-child,.rtab td:first-child,.rtab th:nth-child(2),.rtab td:nth-child(2){text-align:left}
.rtab td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.rtab tr.top td{background:rgba(34,197,94,.06)}.rtab th.on{color:var(--acc2)}
.chatl{display:flex;flex-direction:column;gap:6px;padding-bottom:70px}
.msg{max-width:82%;padding:8px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);word-wrap:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:rgba(139,92,246,.22);border-color:rgba(139,92,246,.4)}
.msg .who{font-size:12px;font-weight:700;color:var(--acc2);margin-bottom:2px}.msg .when{font-size:10px;color:var(--mut2);margin-top:3px;text-align:right}
.msg .del{float:right;color:var(--mut2);margin-left:8px;cursor:pointer;font-size:11px}
.chatbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px 12px;background:rgba(11,13,19,.97);border-top:1px solid var(--line);z-index:4}
.chatbar textarea{min-height:42px;max-height:110px;padding:10px 12px;flex:1}
.chatbar button{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:0 16px;font-size:18px}
.tabs button{position:relative}.tabs .badge{position:absolute;top:2px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--r)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:10px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .t{font-weight:700}details.sec>summary .s{color:var(--mut);font-size:12px;margin-top:2px}
details.sec>summary:after{content:"›";margin-left:auto;color:var(--mut);font-size:22px;transition:transform .2s}
details.sec[open]>summary:after{transform:rotate(90deg)}
details.sec>.card{border:0;border-top:1px solid var(--line);border-radius:0;margin:0}
.warn{background:var(--ybg);border:1px solid rgba(234,179,8,.35);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}

/* ---------- wygląd: dopracowanie (tylko styl) ---------- */
:root{--bg:#090b11;--card:#131722;--card2:#1b2030;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --acc:#8b5cf6;--acc2:#b49cff;--accg:linear-gradient(135deg,#9b6bff 0%,#6d5dfc 55%,#4f7bff 100%);
  --gg:linear-gradient(135deg,#34d672,#16a34a);--rg:linear-gradient(135deg,#f87171,#dc2626);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.28);--rad:18px}
html{background:var(--bg)}
body{background:radial-gradient(900px 420px at 15% -120px,rgba(139,92,246,.20),transparent 70%),
  radial-gradient(700px 380px at 110% -60px,rgba(79,123,255,.13),transparent 70%),var(--bg);background-attachment:fixed;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
::-webkit-scrollbar{width:0;height:0}
h2{font-size:12px;letter-spacing:.09em;color:var(--mut);display:flex;align-items:center;gap:8px;margin:24px 4px 10px}
h2:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accg);box-shadow:0 0 10px rgba(139,92,246,.8)}
.card,details.sec,.ucard{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0)) ,var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.card{padding:15px}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--card2);border:1px solid var(--line);border-radius:14px}
.btn{background:var(--accg);box-shadow:0 6px 18px rgba(110,90,250,.35),0 1px 0 rgba(255,255,255,.18) inset;transition:transform .12s,opacity .12s,box-shadow .2s;letter-spacing:.005em}
.btn.g{background:var(--gg);color:#04210f;box-shadow:0 6px 18px rgba(34,197,94,.28),0 1px 0 rgba(255,255,255,.25) inset}
.btn.r{background:var(--rg);box-shadow:0 6px 18px rgba(239,68,68,.28),0 1px 0 rgba(255,255,255,.18) inset}
.btn.ghost{background:var(--card2);border:1px solid var(--line2);box-shadow:none}
.chip{border-color:var(--line2);padding:7px 13px;font-size:13.5px;transition:background .15s,border-color .15s,transform .12s}
.chip.on{background:var(--accg);border-color:transparent;box-shadow:0 4px 12px rgba(110,90,250,.35)}
.seg{background:rgba(0,0,0,.25);border:1px solid var(--line)}
.seg button{transition:background .15s,color .15s}
.seg button.on{background:var(--accg);box-shadow:0 3px 10px rgba(110,90,250,.35)}
.pill{border:1px solid transparent}.pill.g{border-color:rgba(34,197,94,.25)}.pill.r{border-color:rgba(239,68,68,.25)}
.pill.y{border-color:rgba(234,179,8,.25)}.pill.a{border-color:rgba(139,92,246,.3)}
.item{border-bottom-color:var(--line);transition:background .15s}
.av{background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(79,123,255,.16));border:1px solid var(--line2);color:#e6ddff;font-size:14px}
input,textarea{background:rgba(0,0,0,.22);border-color:var(--line2);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(139,92,246,.22)}
input::placeholder,textarea::placeholder{color:var(--mut2)}
.tabs{background:rgba(12,14,21,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tabs button{transition:color .15s}
.tabs button .i{transition:transform .2s,filter .2s,opacity .2s}
.tabs button.on .i{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 4px 10px rgba(139,92,246,.55))}
.tabs button.on:after{content:"";position:absolute;bottom:-2px;width:18px;height:3px;border-radius:3px;background:var(--accg)}
.status.on{background:linear-gradient(135deg,rgba(34,197,94,.17),rgba(34,197,94,.03) 70%),var(--card);border-color:rgba(34,197,94,.32);box-shadow:0 8px 28px rgba(34,197,94,.08)}
.status.off{background:var(--card);box-shadow:var(--shadow)}
.toast{transform:translateY(calc(-100% - 40px));opacity:0;pointer-events:none;transition:transform .25s,opacity .2s}.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast{background:rgba(28,33,52,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line2)}
.x{border:1px solid var(--line2)}
.toggle span{background:rgba(0,0,0,.3);border-color:var(--line2)}
.toggle input:checked+span{background:var(--gg);border-color:transparent;box-shadow:0 0 12px rgba(34,197,94,.35)}
.toggle span:after{box-shadow:0 2px 6px rgba(0,0,0,.35)}
input[type=range]{background:linear-gradient(90deg,#9b6bff 0%,#6d7bff var(--p,0%),rgba(255,255,255,.08) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{border-color:#8b6bff;box-shadow:0 0 0 4px rgba(139,92,246,.18),0 2px 10px rgba(0,0,0,.5)}
.slv{background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.25)}
.msg{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.msg.me{background:linear-gradient(135deg,rgba(155,107,255,.32),rgba(79,123,255,.2));border-color:rgba(139,92,246,.4)}
.chatbar{background:rgba(9,11,17,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.chatbar button{background:var(--accg);box-shadow:0 4px 12px rgba(110,90,250,.35)}
.selbar{background:rgba(19,23,34,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.big{background:linear-gradient(180deg,#fff,#c9ccdb);-webkit-background-clip:text;background-clip:text;color:transparent}
.warn{border-radius:14px}
.sheet{background:radial-gradient(800px 380px at 20% -120px,rgba(139,92,246,.16),transparent 70%),var(--bg)}
@media (hover:hover){.item:hover{background:rgba(255,255,255,.02)}.chip:hover{border-color:rgba(139,92,246,.45)}}
</style>
</head>
<body>
<div id="view"><div class="loader"></div></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<nav class="tabs" id="tabs"></nav>
<script>
const tg = window.Telegram && Telegram.WebApp;
try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
try { tg.ready(); tg.expand(); tg.setHeaderColor('#0b0d13'); tg.setBackgroundColor('#0b0d13'); } catch (e) {}
// initData od Telegrama (albo z adresu – gdy skrypt Telegrama nie zdążył się wczytać)
const INIT = (tg && tg.initData) || new URLSearchParams(location.hash.slice(1)).get('tgWebAppData') || '';
let S = null, TAB = ({saved: 'traders', traders: 'traders', tokens: 'tokens', history: 'history', settings: 'settings', chat: 'chat'})[new URLSearchParams(location.search).get('tab')] || 'home', SHEET = null, ADMIN = null, TREND = null, LAST_FEED = null;

// ---------- pomocnicze ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (x, d = 4) => x == null ? '—' : Number(x).toFixed(d);
function usd(x) {
  if (x == null) return '—';
  const a = Math.abs(x);
  if (a >= 1e9) return '$' + (x / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return '$' + (x / 1e6).toFixed(2) + 'M';
  if (a >= 1e4) return '$' + (x / 1e3).toFixed(1) + 'K';
  if (a >= 1) return '$' + x.toLocaleString('pl-PL', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  if (a === 0) return '$0';
  return '$' + x.toPrecision(3);
}
const inUsd = sol => (S && S.sol_usd && sol != null) ? usd(sol * S.sol_usd) : '';
function pct(x, plain) {
  if (x == null) return '<span class="mut">—</span>';
  const t = (Math.abs(x) < 0.05 ? '0.0' : (x > 0 ? '+' : '') + x.toFixed(1)) + '%';
  return plain ? t : `<span class="${x > 0.05 ? 'g' : x < -0.05 ? 'r' : 'mut'}">${t}</span>`;
}
const pctPill = x => x == null ? '' : `<span class="pill ${x > 0.05 ? 'g' : x < -0.05 ? 'r' : ''}">${pct(x, true)}</span>`;
const solTxt = (x, d = 4) => (x > 0 ? '+' : '') + num(x, d) + ' SOL';
const hhmm = ts => new Date(ts).toLocaleTimeString('pl-PL', {hour: '2-digit', minute: '2-digit'});
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'przed chwilą'; if (m < 60) return m + ' min temu';
  const h = Math.round(m / 60); if (h < 24) return h + ' h temu';
  return new Date(ts).toLocaleDateString('pl-PL', {day: '2-digit', month: '2-digit'});
}
const short = a => a ? a.slice(0, 4) + '…' + a.slice(-4) : '';
function avText(name) {
  const n = String(name || '?');
  const kol = /^⭐ ([^·]+?) ·/.exec(n), top = /Top (\d+)/.exec(n);
  const src = kol ? kol[1] : (top && !kol ? null : n);
  if (!src && top) return '#' + top[1];  // trader z rankingu: miejsce zamiast „TO”
  return src.replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2).toUpperCase() || '?';
}
const avatar = (name, icon) => `<div class="av">${icon ? `<img src="${esc(icon)}" onerror="this.remove()">` : ''}${icon ? '' : esc(avText(name))}</div>`;
function haptic(t = 'light') { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} }
function toast(msg, ms = 2600) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), ms);
}
function openLink(u) { try { tg.openLink(u); } catch (e) { window.open(u, '_blank'); } }
function confirmBox(text) {
  return new Promise(res => { try { tg.showConfirm(text, ok => res(ok)); } catch (e) { res(window.confirm(text)); } });
}
function copyText(t) {
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Skopiowano ✅'), () => {
    const i = document.createElement('textarea'); i.value = t; document.body.appendChild(i); i.select();
    document.execCommand('copy'); i.remove(); toast('Skopiowano ✅');
  });
}

// wykres liniowy (SVG) – zielony gdy rośnie, czerwony gdy spada
function chart(pts, h = 120, mini = false) {
  const v = (pts || []).map(p => Array.isArray(p) ? p[1] : p).filter(x => x != null);
  if (v.length < 2) return mini ? '' : '<div class="empty small">Wykres pojawi się, gdy zbierze się więcej danych.</div>';
  const w = 300, lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1, pad = mini ? 2 : 8;
  const xy = v.map((y, i) => [i / (v.length - 1) * w, pad + (1 - (y - lo) / span) * (h - 2 * pad)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const col = v[v.length - 1] >= v[0] ? 'var(--g)' : 'var(--r)', id = 'g' + Math.random().toString(36).slice(2, 7);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${mini ? '' : `<path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/>`}
    <path d="${d}" fill="none" stroke="${col}" stroke-width="${mini ? 1.6 : 2.2}" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

// ---------- suwaki ----------
// skala logarytmiczna dla kwot (od 0,001 SOL) – precyzyjnie przy małych kwotach, szybko przy dużych
const SLD = {};
const sig2 = v => parseFloat(Number(v).toPrecision(v < 1 ? 2 : 3));
const R = {
  sol: v => v < 0.01 ? Math.round(v * 1000) / 1000 : sig2(v),
  pct: v => v < 10 ? Math.round(v * 10) / 10 : Math.round(v),
  int: v => Math.round(v),
  tp: v => v < 100 ? Math.round(v / 5) * 5 : Math.round(v / 10) * 10,
  bps: v => Math.round(v / 50) * 50,
};
function slPos(c, v) {
  v = Math.min(Math.max(v || c.min, c.min), c.max);
  return Math.round(c.log ? Math.log(v / c.min) / Math.log(c.max / c.min) * 1000 : (v - c.min) / (c.max - c.min) * 1000);
}
function slVal(c, p) { const v = c.log ? c.min * Math.pow(c.max / c.min, p / 1000) : c.min + (c.max - c.min) * p / 1000; return Math.min(Math.max(c.round(v), c.min), c.max); }
// c: {min, max, log, round, fmt, save(v), off?: tekst gdy 0}
function slider(id, label, c, value) {
  SLD[id] = c;
  const off = c.off && !value, p = slPos(c, off ? c.min : value);
  return `<div class="sl"><div class="row"><div class="sp b small">${label}</div>
      <div class="slv ${off ? 'off' : ''}" id="slv-${id}">${off ? c.off : c.fmt(value)}</div></div>
    <input type="range" min="0" max="1000" value="${p}" style="--p:${p / 10}%" oninput="slMove('${id}', this)" onchange="slSave('${id}', this)">
    <div class="slr"><span>${c.fmt(c.min)}</span><span>${c.fmt(c.max)}</span></div></div>`;
}
function slMove(id, el) {
  const c = SLD[id], v = slVal(c, +el.value);
  el.style.setProperty('--p', el.value / 10 + '%');
  const o = document.getElementById('slv-' + id); o.textContent = c.fmt(v); o.classList.remove('off');
  if (c.live) c.live(v);
  if (Math.round(el.value) % 40 === 0) haptic('light');
}
function slSave(id, el) { const c = SLD[id]; c.save(slVal(c, +el.value)); }
const fSol = v => (v < 0.01 ? String(parseFloat(v.toFixed(5))) : String(sig2(v))) + ' SOL';
const fPct = v => v + '%';
const fSec = v => v < 90 ? Math.round(v) + ' s' : v < 5400 ? Math.round(v / 60) + ' min' : (v / 3600).toFixed(1) + ' h';
function holdTxt(h, long) {
  if (!h || h.median_s == null) return '';
  const flip = h.median_s < 15 && h.n >= 3;
  return `<span class="${flip ? 'r' : h.median_s < 60 ? 'y' : 'g'}">${flip ? '⚡ flipper · ' : '⏱ '}trzyma ~${fSec(h.median_s)}</span>`
    + (long ? ` <span class="mut">(${h.n} zamkn.)</span>` : '');
}

// ---------- API ----------
async function api(path, body) {
  const opt = {headers: {'X-Init-Data': INIT}};
  if (body) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ('Błąd ' + r.status));
  return j;
}
async function act(action, body = {}, {reload = true, quiet = false} = {}) {
  haptic('medium');
  try {
    const r = await api('/api/sol/action', {action, ...body});
    if (!quiet && r.msg) toast(r.msg);
    if (reload) await load();
    return r;
  } catch (e) { toast('⚠️ ' + e.message, 4000); throw e; }
}
let LAST_JSON = '', LOADING = null;
const typing = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA)$/.test(a.tagName); };
async function load() {
  if (LOADING) return LOADING;  // jedno zapytanie naraz – kolejne czekają na ten sam wynik
  LOADING = (async () => {
  try {
    const raw = await fetch('/api/sol/state', {headers: {'X-Init-Data': INIT}});
    const txt = await raw.text();
    if (!raw.ok) { let j = {}; try { j = JSON.parse(txt); } catch (e) {} throw new Error(j.error || ('Błąd ' + raw.status)); }
    if (txt === LAST_JSON && S) return;  // nic się nie zmieniło – bez przerysowania (bez migania)
    LAST_JSON = txt;
    const s = JSON.parse(txt);
    if (S && s.feed.length && LAST_FEED && s.feed[0].ts > LAST_FEED) {
      const f = s.feed[0];
      if (f.status === 'filled') toast(`${f.side === 'buy' ? '🟢 Kupiono' : '🔴 Sprzedano'} ${f.symbol} za ${num(f.sol)} SOL${f.pnl != null ? ` · ${f.pnl >= 0 ? 'zysk +' : 'strata '}${f.pnl.toFixed(4)}` : ''}`);
    }
    LAST_FEED = s.feed.length ? s.feed[0].ts : 0;
    S = s;
    try { localStorage.setItem('state_cache', txt); } catch (e) {}
    if (typing() && TAB !== 'home') renderTabs(); else render();  // nie przerywamy pisania
  } catch (e) {
    if (S) return toast('⚠️ ' + e.message);
    $('#view').innerHTML = `<div class="card c" style="margin-top:40px"><div style="font-size:40px">🔒</div><p>${esc(e.message)}</p>
      <p class="mut small">Otwórz aplikację przyciskiem <b>📱 Aplikacja</b> w czacie z botem.</p>
      <button class="btn ghost" onclick="load()">Spróbuj ponownie</button></div>`;
  } finally { LOADING = null; }
  })();
  return LOADING;
}

let LIVE = {v: -1, c: -1};
async function liveLoop() {
  for (;;) {
    try {
      if (document.visibilityState !== 'visible') { await new Promise(r => setTimeout(r, 2000)); continue; }
      const r = await api(`/api/sol/live?v=${LIVE.v}&c=${LIVE.c}`);
      const tradeChanged = LIVE.v >= 0 && r.v !== LIVE.v, chatChanged = LIVE.c >= 0 && r.c !== LIVE.c;
      LIVE = r;
      if (tradeChanged && !SHEET) load();
      if (chatChanged) { if (TAB === 'chat') loadChat(false); else if (S) { S.chat_last_id++; renderTabs(); } }
    } catch (e) { await new Promise(r => setTimeout(r, 3000)); }
  }
}

function savedRows() {
  const list = savedFiltered();
  const rows = list.slice(0, SAVED_N).map(it => {
    const on = it.status === 'copy', w = esc(it.wallet);
    const open = SEL ? `toggleSel('${w}')` : it.lid ? `openWallet(${it.lid})` : `openLink('https://gmgn.ai/sol/address/${w}')`;
    return `<div class="item" style="cursor:default">
      ${SEL ? `<div class="ck ${SEL.has(it.wallet) ? 'on' : ''}" onclick="toggleSel('${w}')">${SEL.has(it.wallet) ? '✓' : ''}</div>` : ''}
      <div class="av" onclick="${open}">${esc(it.emoji || (it.name || '?').slice(0, 2).toUpperCase())}</div>
      <div class="sp" onclick="${open}" style="cursor:pointer"><div class="b">${esc(it.name || short(it.wallet))}</div>
        <div class="mut tiny">${short(it.wallet)}${it.status === 'watch' ? ' · 👁 obserwujesz' : ''}${agoTxt(it) ? ' · ' + agoTxt(it) : ''}${holdTxt(it.hold) ? ' · ' + holdTxt(it.hold) : ''}</div>
        ${statsTxt(it)}</div>
      <button class="chip" style="padding:6px 10px;${it.priority ? 'color:var(--y);border-color:var(--y)' : ''}" onclick="setPrio('${w}', ${!it.priority})">${it.priority ? '⭐' : '☆'}</button>
      <label class="toggle"><input type="checkbox" ${on ? 'checked' : ''} onchange="setSwitch('${w}', this.checked, this)"><span></span></label></div>`;
  }).join('');
  return (rows || '<div class="empty">Nic nie pasuje</div>') + (list.length > SAVED_N
    ? `<button class="btn ghost" style="margin-top:8px" onclick="SAVED_N+=60;$('#savedl').innerHTML=savedRows()">Pokaż więcej (${list.length - SAVED_N})</button>` : '');
}
function statsTxt(it) {
  const st = it.stats;
  if (!st) return '';
  if (!st.swaps) return `<div class="tiny" style="margin-top:2px">${esc(it.label || '')}</div>`;
  const cls = it.label === '🏆 dobry' ? 'g' : it.label === '⚡ flipper' || it.label === '📉 traci' ? 'r' : 'y';
  return `<div class="tiny" style="margin-top:2px"><span class="${cls} b">${esc(it.label)}</span>
    <span class="mut">· 3 dni: ${st.closed ? `<b class="${st.pnl >= 0 ? 'g' : 'r'}">${st.pnl >= 0 ? '+' : ''}${st.pnl.toFixed(2)} SOL</b> · trafia ${Math.round((st.win_rate || 0) * 100)}% (${st.closed})` : st.swaps + ' wymian'}${st.hold_s != null ? ' · trzyma ~' + fSec(st.hold_s) : ''} · ${st.per_day.toFixed(0)}/dzień</span></div>`;
}

async function enableBest() {

  await act('enable_best', {n: 5}, {reload: false}); await loadSaved(); load();
}
async function removeInactive() {
  if (!await confirmBox('Usunąć z listy traderów, którzy od 7 dni nic nie kupili? Włączonych, obserwowanych i ⭐ nie ruszam.')) return;
  await act('remove_inactive', {days: 7}, {reload: false}); await loadSaved();
}
function toggleSelect() { SEL = SEL ? null : new Set(); renderSel(); }
function toggleSel(w) { SEL.has(w) ? SEL.delete(w) : SEL.add(w); haptic(); renderSel(); }
function selectAll() { savedFiltered().forEach(it => SEL.add(it.wallet)); renderSel(); }
function renderSel() {
  const el = $('#saved'); if (el) el.innerHTML = savedHtml();

  document.body.classList.toggle('sel', !!SEL && TAB === 'traders');

async function bulk(op) {
  const n = SEL.size;
  const ask = {delete: `Usunąć ${n} traderów z listy? Przestaniesz ich kopiować i obserwować. Tokeny, które masz, zostają.`,
               off: `Wyłączyć kopiowanie ${n} traderów?`, on: `Włączyć kopiowanie ${n} traderów?`}[op];
  if (ask && !await confirmBox(ask)) return;
  const r = await act('bulk', {op, wallets: [...SEL]}, {reload: false});
  if (r) { SEL = op === 'delete' ? new Set() : SEL; await loadSaved(); renderSel(); load(); }
}
async function setSwitch(wallet, on, el) {

  await loadSaved(); load();
}
async function setPrio(wallet, on) {

const OPEN = new Set(['Ile wydać', 'Strategia']);
function secSummary(title) {
  const st = S.settings, f = [];
  if (title.includes('Ile wydać')) return S.default_amount;
  if (title.includes('Strategia')) {
    if (st.sol_consensus) f.push('tylko gdy ' + st.sol_consensus + '+ traderów');
    if (st.sol_boost > 1) f.push('×' + st.sol_boost + ' przy potwierdzeniu');
    if (st.sol_trail) f.push('ruchomy stop ' + st.sol_trail + '%');
    if (st.sol_auto_rank) f.push('🤖 auto-ocena');
    return f.join(' · ') || 'podstawowa – kopiuje każdy zakup';
  }
  if (title.includes('Co kopiować')) {
    if (st.sol_no_add) f.push('nie dokupuj');
    if (st.sol_min_lead) f.push('zakupy tradera ≥ ' + st.sol_min_lead + ' SOL');
    if (st.sol_min_hold) f.push('bez flipperów < ' + fSec(st.sol_min_hold));
    return f.join(' · ') || 'bez filtrów – kopiuje wszystko';
  }
  if (title.includes('Bezpieczniki')) return `maks. ${st.sol_max ? st.sol_max + ' SOL' : 'bez limitu'} na zakup · limit dnia ${st.sol_day_limit ? st.sol_day_limit + ' SOL' : 'wył.'}${st.sol_max_pos ? ' · do ' + st.sol_max_pos + ' pozycji' : ''}${st.sol_safe ? ' · 🛡 pułapki' : ''}${st.sol_streak ? ' · ☕ po ' + st.sol_streak + ' stratach' : ''}`;
  if (title.includes('Automatyczna')) {
    if (st.sol_x2) f.push('zwrot wkładu ×2');
    if (st.sol_tp) f.push('zysk +' + st.sol_tp + '%');
    if (st.sol_sl) f.push('strata −' + st.sol_sl + '%');
    return f.join(' · ') || 'wyłączona – sprzedaje tylko za traderem';
  }
  if (title.includes('Tolerancja')) return st.sol_slippage_bps / 100 + '%';
  if (title.includes('Powiadomienia')) return {all: 'wszystkie', sells: 'tylko wyniki sprzedaży', none: 'wyłączone'}[st.sol_notify || 'all'];
  if (title.includes('Szybkość')) return (st.sol_turbo ? '⚡ turbo · ' : '') + 'opłata maks. ' + fSol(st.sol_priority / 1e9);
  if (title.includes('Bezpieczeństwo')) return S.has_pin ? '🔐 PIN ustawiony' : '⚠️ bez PIN-u – ustaw, chroni wypłaty';
  if (title.includes('Twoja nazwa')) return S.user.nickname || (S.user.username ? '@' + S.user.username : 'bez nazwy');
  if (title.includes('Pieniądze')) return S.live ? '💰 prawdziwe SOL' : `🧪 ćwiczenia · start ${S.demo_start} SOL`;
  return '';
}
function foldSettings() {
  document.querySelectorAll('#view h2').forEach(h => {
    const card = h.nextElementSibling;
    if (!card || !card.classList.contains('card')) return;
    const title = h.textContent.trim(), key = title.replace(/^[^\p{L}]+/u, '');
    const d = document.createElement('details');
    d.className = 'sec';
    if ([...OPEN].some(k => key.startsWith(k))) d.open = true;
    d.innerHTML = `<summary><div><div class="t">${esc(title)}</div><div class="s">${esc(secSummary(title))}</div></div></summary>`;
    h.replaceWith(d);
    d.appendChild(card);
    d.addEventListener('toggle', () => { d.open ? OPEN.add(key) : OPEN.delete(key); if (d.open) haptic(); });
  });
}

    <div class="stat"><div class="mut tiny">Kopie 24 h</div><div class="v">${T.trades24}</div></div>
    <div class="stat"><div class="mut tiny">Pominięte / błędy</div><div class="v ${T.errors24 ? 'r' : ''}">${T.skipped24} / ${T.errors24}</div></div>
    <div class="stat"><div class="mut tiny">Śr. szybkość</div><div class="v">${T.latency_ms != null ? (T.latency_ms / 1000).toFixed(2) + ' s' : '—'}</div></div>
  </div>
  <div class="grid" style="margin-bottom:12px">
    <div class="stat"><div class="mut tiny">Wartość 💰 prawdziwe</div><div class="v">${num(T.value_live, 3)} SOL</div><div class="mut tiny">${inUsd(T.value_live)}</div></div>
    <div class="stat"><div class="mut tiny">Wynik dziś (wszyscy)</div><div class="v ${T.today_pnl > 0 ? 'g' : T.today_pnl < 0 ? 'r' : ''}">${solTxt(T.today_pnl, 3)}</div><div class="mut tiny">🧪 w ćwiczeniach: ${num(T.value_demo, 2)} SOL</div></div>
  </div>
  <div class="seg" style="margin-bottom:10px">${seg.map(([k, l]) => `<button class="${ADM_T === k ? 'on' : ''}" onclick="ADM_T='${k}';render()">${l}</button>`).join('')}</div>
  ${({users: admUsers, feed: admFeed, leaders: admLeaders, issues: admIssues})[ADM_T]()}`;
}
function timingHtml(tm) {
  if (!tm) return '';
  const row = (l, x) => x && x.n ? `<div class="note small"><b>${l}</b> <span class="mut">(${x.n} transakcji)</span><br>przygotowanie ${x.prep} ms · wycena ${x.quote} ms · budowa ${x.build} ms · <b>w bloku po ${(x.confirm / 1000).toFixed(2)} s</b></div>` : '';
  const html = row('⚡ Turbo', tm.turbo) + row('Zwykły tryb', tm.normal);
  return html ? `<div style="margin-top:10px"><div class="mut tiny">⏱ Szybkość transakcji na prawdziwych SOL (od wykrycia ruchu tradera)</div>${html}</div>` : '';
}
function admUsers() {
  const sorts = {active: (a, b) => (b.active - a.active) || ((b.last_ts || 0) - (a.last_ts || 0)), value: (a, b) => (b.total || 0) - (a.total || 0),
    result: (a, b) => (b.result ?? -1e9) - (a.result ?? -1e9), trades: (a, b) => (b.trades24 || 0) - (a.trades24 || 0)};
  const list = ADMIN.users.slice().sort(sorts[ADM_SORT]);
  const chip = (k, l) => `<button class="chip ${ADM_SORT === k ? 'on' : ''}" onclick="ADM_SORT='${k}';render()">${l}</button>`;
  return `<div class="chips" style="margin-bottom:10px">${chip('active', 'Aktywni')}${chip('value', 'Wartość')}${chip('result', 'Wynik')}${chip('trades', 'Ruchy 24 h')}</div>` +
    (list.map(x => `<div class="ucard" onclick="openUser(${x.id})">
      <div class="row">${avatar(x.name.replace('@', ''))}<div class="sp"><div class="b">${esc(x.name)} <span class="tiny">${x.role === 'owner' ? '👑' : x.role === 'admin' ? '⭐' : ''}</span>${x.nickname && x.username ? ` <span class="mut tiny">@${esc(x.username)}</span>` : ''}</div>
        <div class="row" style="gap:4px;flex-wrap:wrap;margin-top:3px"><span class="pill ${x.active ? 'g' : ''}">${x.active ? '▶️ kopiuje' : '⏸ stoi'}</span>
          ${x.live ? '<span class="pill y">💰</span>' : '<span class="pill a">🧪</span>'}<span class="pill">👥 ${x.wallets.filter(w => w.copy).length}</span></div></div>
        <div style="text-align:right"><div class="b">${x.total != null ? num(x.total, 3) + ' SOL' : '—'}</div><div class="tiny">${pct(x.result)}</div></div></div>
      ${x.has_wallet ? `<div style="margin-top:8px">${chart(x.spark, 36, true)}</div>
      <div class="row tiny mut" style="margin-top:6px;flex-wrap:wrap;gap:8px"><span>dziś <b class="${x.today_pnl > 0 ? 'g' : x.today_pnl < 0 ? 'r' : ''}">${solTxt(x.today_pnl || 0, 3)}</b></span>
        <span>ruchy 24 h: <b>${x.trades24 ?? 0}</b></span><span>pozycje: <b>${x.positions}</b></span><span>ostatni ruch: <b>${x.last_ts ? ago(x.last_ts) : '—'}</b></span></div>`
      : '<div class="mut tiny" style="margin-top:6px">jeszcze nie używa Solany</div>'}</div>`).join('') || '<div class="empty">Nikogo</div>');
}
function admFeed() {
  const f = ADMIN.feed;
  return `<div class="card">${f.length ? f.map(r => {
    const ok = r.status === 'filled', buy = r.side === 'buy';
    return `<div class="item" onclick="openUser(${r.uid})"><div class="av" style="background:${!ok ? 'var(--ybg)' : buy ? 'var(--gbg)' : 'var(--rbg)'}">${!ok ? '⚠️' : buy ? '🟢' : '🔴'}</div>
      <div class="sp"><div class="b">${esc(r.user)} · ${ok ? (buy ? 'kupił' : 'sprzedał') : 'pominięto'} ${esc(r.symbol)}</div>
        <div class="mut tiny">${hhmm(r.ts)}${r.leader ? ' · od ' + esc(r.leader) : ' · ręcznie'} · ${r.paper ? '🧪' : '💰'}${ok && r.latency_ms != null ? ' · ⚡' + (r.latency_ms / 1000).toFixed(2) + ' s' : ''}${!ok ? ' · ' + esc((r.info || '').slice(0, 70)) : ''}</div></div>
      ${ok ? `<div style="text-align:right"><div class="b">${num(r.sol, 3)}</div><div class="mut tiny">SOL</div></div>` : ''}</div>`;
  }).join('') : '<div class="empty">Jeszcze żadnych ruchów</div>'}</div>`;
}
function admLeaders() {
  const l = ADMIN.leaders;
  return `<div class="card">${l.length ? l.map((x, i) => `<div class="item" onclick="openLink('https://gmgn.ai/sol/address/${esc(x.wallet)}')">
      <div class="av">${i + 1}</div><div class="sp"><div class="b">${esc(x.name)}</div>
      <div class="mut tiny">kopiuje ${x.copiers} os. · obserwuje ${x.followers - x.copiers} · kopie 24 h: ${x.copies24}</div></div>
      <div>${pct(x.result)}</div></div>`).join('') : '<div class="empty">Nikt nikogo nie kopiuje</div>'}</div>
    <div class="mut tiny c">Kliknij, żeby zobaczyć tradera na GMGN.</div>`;
}
function admIssues() {
  const r = ADMIN.skip_reasons, T = ADMIN.totals;
  const hint = s => /za późno/.test(s) ? 'Kopia przyszła później niż limit – zwykle przy przeciążeniu RPC albo limicie Jupitera.'
    : /limit zapytań/.test(s) ? 'Darmowy plan Jupitera: 10 zapytań / 10 s. Pomaga mniej kopiowanych traderów albo płatny klucz.'
    : /za mało SOL/.test(s) ? 'Ktoś nie ma już wolnych SOL – wpłata albo mniejsza kwota zakupu.'
    : /ryzykowny/.test(s) ? 'Zadziałał filtr 🛡 ryzykownych tokenów – tak ma być.'
    : /brak trasy/.test(s) ? 'Jupiter nie znalazł trasy wymiany (np. świeży token z Pump.fun bez płynności).'
    : /dzienny limit/.test(s) ? 'Zadziałał dzienny limit straty – tak ma być.' : '';
  return `<div class="card"><div class="b">Ostatnie 24 h</div><div class="mut small" style="margin-top:4px">Skopiowano ${T.trades24} · pominięto ${T.skipped24} · błędy ${T.errors24}</div></div>
    <div class="card">${r.length ? r.map(x => `<div class="note"><div class="row"><div class="sp">${esc(x.info || '—')}</div><span class="pill">×${x.n}</span></div>
      ${hint(x.info || '') ? `<div class="mut tiny" style="margin-top:4px">💡 ${hint(x.info || '')}</div>` : ''}</div>`).join('') : '<div class="empty">Brak problemów 🎉</div>'}</div>`;
}
async function loadAdmin(manual) {
  try { ADMIN = await api('/api/sol/admin/users'); ADM_AT = Date.now(); if (manual) toast('Odświeżono', 900); } catch (e) { toast('⚠️ ' + e.message); }
  if (TAB === 'admin' && !SHEET) render();
}
async function adminPause(on) {
  if (on && !await confirmBox('Wstrzymać kopiowanie WSZYSTKIM? Bot przestanie kupować i sprzedawać za kogokolwiek, dopóki nie wznowisz.')) return;
  await act('admin_pause', {on}, {reload: false}); loadAdmin();
}
async function openUser(id) {
  loading('Podgląd');
  try {
    const d = await api('/api/sol/admin/user/' + id);
    const own = ADMIN && ADMIN.owner, ds = d.day_stats || {};
    sheet(hdr(esc(d.name)) + `
      <div class="card"><div class="row" style="flex-wrap:wrap;gap:6px">${d.live ? '<span class="pill y">💰 prawdziwe</span>' : '<span class="pill a">🧪 ćwiczenia</span>'}
        <span class="pill ${d.active ? 'g' : ''}">${d.active ? '▶️ kopiuje' : '⏸ stoi'}</span><span class="pill">${ROLE[d.role]}</span>${d.session ? '<span class="pill g">sesja trwa</span>' : ''}</div>
        <div class="big" style="margin-top:10px">${d.total != null ? num(d.total) + ' SOL' : '—'}</div>
        <div class="small">${pct(d.result)} <span class="mut">${inUsd(d.total)}</span></div>
        <div style="margin:10px -4px 0">${chart(d.series, 100)}</div>
        <div class="kpi" style="margin-top:10px">
          <div class="stat"><div class="mut tiny">Dziś</div><div class="v small ${d.today_pnl > 0 ? 'g' : d.today_pnl < 0 ? 'r' : ''}">${solTxt(d.today_pnl || 0, 3)}</div></div>
          <div class="stat"><div class="mut tiny">Kopie 24 h</div><div class="v small">${ds.filled || 0}</div></div>
          <div class="stat"><div class="mut tiny">Pominięte</div><div class="v small ${(ds.skipped || 0) + (ds.error || 0) ? 'y' : ''}">${(ds.skipped || 0) + (ds.error || 0)}</div></div></div>
        <div class="mut tiny" style="margin-top:8px">⚙️ ${esc(d.settings)}</div></div>
      <h2>Traderzy (${d.wallets.length})</h2><div class="card">${d.wallets.length ? d.wallets.map(w => `<div class="item" style="cursor:default;padding:9px 2px">
          <div class="sp" style="min-width:0"><div class="b" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${w.copy ? '🟢' : '👁'} ${esc(w.name)}</div>
            <div class="mut tiny" style="font-family:ui-monospace,monospace">${short(w.wallet)}</div></div>
          ${d.id === S.user.id ? '' : `<button class="chip" style="padding:5px 10px;font-size:12.5px" onclick="admCopy(${d.id}, ['${w.wallet}'], true)">🟢 Kopiuj</button>
          <button class="chip" style="padding:5px 10px;font-size:12.5px" onclick="admCopy(${d.id}, ['${w.wallet}'], false)">➕</button>`}</div>`).join('') : '<div class="empty">nikogo</div>'}
        ${d.wallets.length && d.id !== S.user.id ? `<button class="btn" style="margin-top:10px" onclick="admCopy(${d.id}, null, true)">📋 Kopiuj wszystkich, których kopiuje (${d.wallets.filter(w => w.copy).length})</button>
          <button class="btn ghost" style="margin-top:8px" onclick="admCopy(${d.id}, null, false, true)">➕ Tylko dodaj wszystkich do mojej listy (${d.wallets.length})</button>` : ''}</div>
      <h2>Tokeny (${d.positions_list.length})</h2><div class="card">${d.positions_list.length ? d.positions_list.map(p => `<div class="item" onclick="openToken('${esc(p.mint)}')">${avatar(p.symbol)}<div class="sp"><div class="b">${esc(p.symbol)}</div><div class="mut tiny">${fmtTok(p.tokens)} szt.</div></div>
        <div style="text-align:right"><div class="b">${p.value != null ? num(p.value, 3) + ' SOL' : '—'}</div><div class="tiny">${pct(p.pnl)}</div></div></div>`).join('') : '<div class="empty">brak</div>'}</div>
      <h2>Ostatnie ruchy</h2><div class="card">${d.history.length ? d.history.map(feedItem).join('') : '<div class="empty">brak</div>'}</div>
      <button class="btn ghost" style="margin-bottom:8px" onclick="renameUser(${d.id}, '${esc((d.nickname || '').replace(/'/g, ''))}')">✏️ Zmień nazwę${d.username ? ` <span class="mut tiny">(@${esc(d.username)})</span>` : ''}</button>
      ${d.active ? `<button class="btn r" onclick="adminStop(${d.id})">⏸ Zatrzymaj mu kopiowanie</button>` : ''}
      ${own && d.role !== 'owner' ? `<button class="btn ghost" style="margin-top:8px" onclick="adminRole(${d.id})">${d.role === 'admin' ? 'Zabierz rangę admina' : '⭐ Daj rangę admina'}</button>` : ''}`);
  } catch (e) { sheet(hdr('Podgląd') + `<div class="empty">${esc(e.message)}</div>`); }
}
async function admCopy(id, wallets, copy, all) {
  const n = wallets ? wallets.length : null;
  if (!await confirmBox(copy ? `Dodać ${n === 1 ? 'tego tradera' : 'tych traderów'} do Twojej listy i od razu włączyć kopiowanie?` : `Dodać ${n === 1 ? 'tego tradera' : 'traderów tej osoby'} do Twojej listy (wyłączonych – włączysz, kogo chcesz)?`)) return;
  await act('admin_copy_traders', {uid: id, wallets: wallets || undefined, copy, only_copied: !all}, {reload: false});
  SAVED = null; load();
}
async function adminStop(id) {
  if (!await confirmBox('Zatrzymać tej osobie kopiowanie? Dostanie powiadomienie i raport sesji.')) return;
  await act('admin_stop', {uid: id}, {reload: false}); await loadAdmin(); openUser(id);
}
async function renameUser(id, cur) {
  const n = prompt('Nowa nazwa (puste = usuń):', cur || '');
  if (n === null) return;
  await act('nickname', {uid: id, name: n}, {reload: id === S.user.id, quiet: false});
  await loadAdmin(); if (SHEET) openUser(id);
}
async function adminRole(id) { await act('admin_role', {uid: id}, {reload: false}); await loadAdmin(); openUser(id); }

// ---------- start ----------
// pierwsze otwarcie: od razu ostatni zapamiętany stan, w tle świeże dane
try {
  const c = localStorage.getItem('state_cache');
  if (c) { S = JSON.parse(c); LAST_JSON = ''; render(); }
} catch (e) { S = null; }
load().then(liveLoop);
// ceny i wartości zmieniają się bez zdarzeń – co 20 s ciche odświeżenie widocznej zakładki
setInterval(() => {
  if (SHEET || document.visibilityState !== 'visible') return;
  if (['home', 'history', 'tokens'].includes(TAB)) load();
  else if (TAB === 'admin') loadAdmin();
}, 20000);
// zapas dla czatu (gdy połączenie na żywo chwilowo nie działa)
setInterval(() => { if (TAB === 'chat' && !SHEET && document.visibilityState === 'visible') loadChat(false); }, 10000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
</script>
</body>
</html>
